# Fly.io config for Socials. If the name "socials" is taken, change app to "socials-lee".
app = "socials-lee"
primary_region = "lhr"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  COOKIE_SECURE = "true"
  DATABASE_PATH = "/data/socials.sqlite"
  WEB_ROOT = "/app/web"

# Secrets (never in this file): ADMIN_PASSWORD (required, 16+ chars), ENCRYPTION_KEY (64 hex chars).

[mounts]
  source = "socials_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running so the scheduler can post on time.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
